<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job – JobLink</title>
    <link rel="stylesheet" href="public/css/global.css">
    <link rel="stylesheet" href="public/css/employer.css">
</head>
<body>
<div class="dash-wrapper">
    <aside class="dash-sidebar">
        <a href='?role=employer&page=dashboard' class="logo">Job<span>Link</span></a>
        <div class="user-info"><div class="name">{{company_name}}</div><div class="role">Employer</div></div>
        <nav>
            <a href="?role=employer&page=dashboard" class="nav-item"><span class="icon">📊</span><span>Dashboard</span></a>
            <a href="?role=employer&page=company-profile" class="nav-item"><span class="icon">🏢</span><span>Company Profile</span></a>
            <a href="?role=employer&page=post-job" class="nav-item"><span class="icon">➕</span><span>Post a Job</span></a>
            <a href="?role=employer&page=manage-jobs" class="nav-item"><span class="icon">📋</span><span>Manage Jobs</span></a>
            <a href="?role=employer&page=applicants" class="nav-item"><span class="icon">👥</span><span>Applications</span></a>
            <a href="?role=employer&page=settings" class="nav-item"><span class="icon">⚙️</span><span>Settings</span></a>
        </nav>
        <a href="?page=logout" class="logout">🚪 Logout</a>
    </aside>
    <main class="dash-main">
        <div class="page-title">Edit Job: {{job_title}}</div>
        <div class="page-sub"><a href="?role=employer&page=manage-jobs">← Back to Manage Jobs</a></div>
        <form class="dash-form" method="POST" action="?role=employer&page=edit-job">
            <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px;">
                <h3>Basic Information</h3>
                <div class="form-row">
                    <div><label>Job Title</label><input type="text" name="job_title" value="{{job_title}}"></div>
                    <div><label>Category</label><select name="category">{{category_options}}</select></div>
                </div>
                <div class="form-row">
                    <div><label>Number of Vacancies</label><input type="number" name="vacancies" value="{{vacancies}}"></div>
                    <div><label>Location</label><input type="text" name="location" value="{{location}}"></div>
                    <div><label>Job Type</label>
                        <select name="job_type"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Remote</option></select>
                    </div>
                </div>
                <h3 style="margin:16px 0 12px;">Compensation</h3>
                <div class="form-row">
                    <div><label>Minimum Salary (₱/month)</label><input type="text" name="min_salary" value="{{min_salary}}"></div>
                    <div><label>Maximum Salary (₱/month)</label><input type="text" name="max_salary" value="{{max_salary}}"></div>
                </div>
                <h3 style="margin:16px 0 12px;">Job Details</h3>
                <label>Job Description</label>
                <textarea name="description" rows="4">{{description}}</textarea>
                <label>Key Responsibilities (one per line)</label>
                <textarea name="responsibilities" rows="4">{{responsibilities_raw}}</textarea>
                <h3 style="margin:16px 0 12px;">Requirements</h3>
                <label>Education</label>
                <input type="text" name="education" value="{{education}}">
                <label>Experience</label>
                <input type="text" name="experience" value="{{experience}}">
                <label>Required Skills</label>
                <input type="text" name="skills" value="{{skills}}">
                <h3 style="margin:16px 0 12px;">Benefits (one per line)</h3>
                <textarea name="benefits" rows="4">{{benefits_raw}}</textarea>
                <div style="display:flex;gap:12px;margin-top:16px;">
                    <button type="submit" class="btn btn-primary">Update Job</button>
                    <a href="?role=employer&page=manage-jobs" class="btn btn-outline">Cancel</a>
                </div>
            </div>
        </form>
    </main>
</div>
<script src="public/js/global.js"></script>
<script src="public/js/employer.js"></script>
</body>
</html>
