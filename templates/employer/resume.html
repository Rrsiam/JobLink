<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume &ndash; JobLink</title>
    <link rel="stylesheet" href="public/css/global.css">
    <link rel="stylesheet" href="public/css/employer.css">
</head>
<body>
<div class="dash-wrapper">
    <aside class="dash-sidebar">
        <a href="?role=employer&page=dashboard" class="logo">Job<span>Link</span></a>
        <div class="user-info"><div class="name">{{company_name}}</div><div class="role">Employer</div></div>
        <nav>
            <a href="?role=employer&page=dashboard" class="nav-item"><span class="icon">&#128202;</span><span>Dashboard</span></a>
            <a href="?role=employer&page=company-profile" class="nav-item"><span class="icon">&#127970;</span><span>Company Profile</span></a>
            <a href="?role=employer&page=post-job" class="nav-item"><span class="icon">&#10133;</span><span>Post a Job</span></a>
            <a href="?role=employer&page=manage-jobs" class="nav-item"><span class="icon">&#128203;</span><span>Manage Jobs</span></a>
            <a href="?role=employer&page=applicants" class="nav-item active"><span class="icon">&#128101;</span><span>Applications</span></a>
            <a href="?role=employer&page=settings" class="nav-item"><span class="icon">&#9881;</span><span>Settings</span></a>
        </nav>
        <a href="?page=logout" class="logout">&#128682; Logout</a>
    </aside>
    <main class="dash-main">
        <div class="page-title">Resume</div>
        <div class="page-sub">{{applicant_name}} &middot; {{job_title}}</div>
        {{notification}}
        <div class="rv-bar">
            <a class="btn btn-outline" href="{{back_url}}">&larr; Back to application</a>
            <div class="rv-bar-actions">
                <span class="rv-meta">{{resume_meta}}</span>
                <a class="btn btn-primary" href="{{download_url}}">Download</a>
            </div>
        </div>
        {{note_html}}
        <div class="rv-frame">
            {{doc_html}}
            {{viewer_html}}
            {{empty_html}}
        </div>
    </main>
</div>
<script src="public/js/global.js"></script>
<script src="public/js/employer.js"></script>
</body>
</html>
