<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Jobs – JobLink</title>
    <link rel="stylesheet" href="public/css/global.css">
    <link rel="stylesheet" href="public/css/applicant.css">
</head>
<body>
<div class="dash-wrapper">
    <aside class="dash-sidebar">
        <a href='?role=applicant&page=dashboard' class="logo">Job<span>Link</span></a>
        <div class="user-info"><div class="name">{{name}}</div><div class="role">Applicant</div></div>
        <nav>
            <a href="?role=applicant&page=dashboard" class="nav-item"><span class="icon">📊</span><span>Dashboard</span></a>
            <a href="?role=applicant&page=find-jobs" class="nav-item active"><span class="icon">🔍</span><span>Find Jobs</span></a>
            <a href="?role=applicant&page=saved-jobs" class="nav-item"><span class="icon">❤️</span><span>Saved Jobs</span></a>
            <a href="?role=applicant&page=applications" class="nav-item"><span class="icon">📋</span><span>My Applications</span></a>
            <a href="?role=applicant&page=resume" class="nav-item"><span class="icon">📄</span><span>Resume</span></a>
            <a href="?role=applicant&page=profile" class="nav-item"><span class="icon">👤</span><span>Profile</span></a>
            <a href="?role=applicant&page=settings" class="nav-item"><span class="icon">⚙️</span><span>Settings</span></a>
        </nav>
        <a href="?page=logout" class="logout">🚪 Logout</a>
    </aside>
    <main class="dash-main">
        <div class="page-title">Find Jobs</div>
        <div class="page-sub">Search thousands of jobs from top local employers</div>
        {{filter_note}}
        <form method="GET" action="?role=applicant&page=find-jobs">
            <input type="hidden" name="role" value="applicant">
            <input type="hidden" name="page" value="find-jobs">
            <div class="search-bar" style="margin:16px 0;">
                <input type="text" name="search" value="{{search_value}}" placeholder="Job title, keywords, or company">
                <input type="text" name="location" value="{{location_value}}" placeholder="City, state, or ZIP">
                <button type="submit">Search Jobs</button>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:16px;margin:16px 0;">
                <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;min-width:200px;">
                    <strong>Filters</strong>
                    <div style="margin-top:8px;">
                        <label style="display:block;font-size:13px;font-weight:500;">Category</label>
                        <select name="category" style="width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:6px;">
                            {{category_options}}
                        </select>
                    </div>
                    <div style="margin-top:8px;">
                        <label style="display:block;font-size:13px;font-weight:500;">Job Type</label>
                        <select name="type" style="width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:6px;">
                            {{type_options}}
                        </select>
                    </div>
                    <div style="margin-top:12px;">
                        <button type="submit" class="btn btn-primary btn-block">Apply Filters</button>
                    </div>
                </div>
                <div style="flex:1;">
                    <div class="job-grid" style="grid-template-columns:1fr;">
                        {{job_list}}
                    </div>
                    <div class="text-muted" style="margin-top:8px;">Showing {{showing}} of {{total}} jobs</div>
                </div>
            </div>
        </form>
    </main>
</div>
<script src="public/js/global.js"></script>
<script src="public/js/applicant.js"></script>
</body>
</html>
