<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile &ndash; JobLink</title>
    <link rel="stylesheet" href="public/css/global.css?v=6">
    <link rel="stylesheet" href="public/css/applicant.css?v=6">
    <link rel="stylesheet" href="public/css/admin.css?v=6">
</head>
<body>
<div class="dash-wrapper">
    <aside class="dash-sidebar">
        <a href="?role=admin&page=dashboard" class="logo">Job<span>Link</span></a>
        <div class="user-info"><div class="name">{{name}}</div><div class="role">Admin</div></div>
        <nav>
            <a href="?role=admin&page=dashboard" class="nav-item"><span class="icon">📊</span><span>Dashboard</span></a>
            <a href="?role=admin&page=applicants" class="nav-item"><span class="icon">👤</span><span>Applicants</span></a>
            <a href="?role=admin&page=employers" class="nav-item"><span class="icon">🏢</span><span>Employers</span></a>
            <a href="?role=admin&page=jobs" class="nav-item"><span class="icon">💼</span><span>Jobs</span></a>
            <a href="?role=admin&page=applications" class="nav-item"><span class="icon">📋</span><span>Applications</span></a>
            <a href="?role=admin&page=profile" class="nav-item"><span class="icon">👤</span><span>Profile</span></a>
            <a href="?role=admin&page=categories" class="nav-item"><span class="icon">📂</span><span>Categories</span></a>
            <a href="?role=admin&page=reports" class="nav-item"><span class="icon">📈</span><span>Reports</span></a>
            <a href="?role=admin&page=settings" class="nav-item"><span class="icon">⚙️</span><span>Settings</span></a>
        </nav>
        <a href="?page=logout" class="logout">🚪 Logout</a>
    </aside>
    <main class="dash-main">
        <div class="page-title">Edit Profile</div>
        <div class="page-sub">Update the administrator details shown on your profile.</div>
        {{notification}}
        <form class="dash-form" method="POST" action="?role=admin&amp;page=edit-profile" enctype="multipart/form-data">
            <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px;margin-bottom:24px;margin-top:16px;">
                <h3 style="margin:0 0 12px;">Account Information</h3>
                <div class="form-row">
                    <div><label>Full Name</label><input type="text" name="name" value="{{name}}" required></div>
                    <div><label>Role</label><input type="text" value="Admin" disabled></div>
                </div>
                <div class="form-row">
                    <div><label>Email Address</label><input type="email" name="email" value="{{email}}" required></div>
                    <div><label>Phone Number</label><input type="tel" name="phone" value="{{phone}}"></div>
                </div>
                <h3 style="margin:16px 0 12px;">Profile</h3>
                <div class="form-row">
                    <div><label>Professional Title</label><input type="text" name="title" value="{{title}}" placeholder="e.g. Platform Administrator"></div>
                    <div><label>Department</label><input type="text" name="department" value="{{department}}" placeholder="e.g. Operations"></div>
                </div>
                <div class="form-row">
                    <div><label>Address / Location</label><input type="text" name="address" value="{{address}}"></div>
                </div>
                <h3 style="margin:16px 0 12px;">Photo</h3>
                <div class="pf-avatar" style="display:{{photo_show}};width:84px;height:84px;margin-bottom:12px;">{{photo_preview}}</div>
                <input type="file" name="photo" accept="image/jpeg,image/png,image/gif,image/webp">
                <div style="display:flex;gap:12px;margin-top:16px;">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="?role=admin&amp;page=profile" class="btn btn-outline">Cancel</a>
                </div>
            </div>
        </form>
    </main>
</div>
<script src="public/js/global.js"></script>
<script src="public/js/applicant.js"></script>
</body>
</html>
